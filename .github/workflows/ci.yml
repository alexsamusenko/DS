name: CI

# До этого файла ни один push/PR не запускал тесты автоматически -- прогон
# существовавшего docker-compose сервиса `test` был полностью ручным
# (`docker compose run --rm test`). См. аудит перед развёртыванием.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Установить пакет + dev/api-зависимости
        run: pip install -e ".[dev,api]"

      - name: Ruff -- lint
        run: ruff check .

      - name: Ruff -- форматирование
        run: ruff format --check .

      - name: mypy
        run: mypy src service

      - name: pip-audit -- известные CVE в зафиксированных версиях
        run: pip-audit --strict
        continue-on-error: true # первая линия предупреждения; не блокирует, пока список зависимостей не стабилизируется

      - name: Тесты + покрытие (порог -- pyproject.toml, tool.pytest.ini_options)
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Тесты (vitest)
        run: npm test -- --run
      - name: Сборка (проверяет, что service/app.py сможет смонтировать frontend/dist)
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Собрать основной образ (app/test/validate)
        run: docker build -t ds-app:ci .
      - name: Прогнать полный набор тестов внутри образа (как docker compose run --rm test)
        run: docker run --rm ds-app:ci python3 -m pytest tests/ -v
