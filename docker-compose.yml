# Четыре независимых сценария использования (docs/project_overview.md):
#   app      -- запуск единого API (L3-L5)
#   test     -- полный набор тестов
#   validate -- формальная проверка каждого модуля (L2-L5): сборка демо-примеров
#   train    -- дообучение моделей (training/), отдельный, более тяжёлый образ
#
# Запуск: docker compose run --rm <сервис> [доп. аргументы команды]
# (кроме app -- тот демон, для него docker compose up app)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    command: ["python3", "-m", "uvicorn", "service.app:app", "--host", "0.0.0.0", "--port", "8000"]

  test:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "-m", "pytest", "tests/", "-v"]

  validate:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./build:/app/build
    command: >
      sh -c "python3 -m ds_ontology.build &&
             python3 -m ds_preprocessing.build_demo &&
             python3 -m ds_prediction.build_demo &&
             python3 -m ds_optimization.build_demo"

  train:
    build:
      context: .
      dockerfile: Dockerfile.training
    volumes:
      - ./data:/app/data      # положите сюда скачанные датасеты (data/plantdoc и т.п.)
      - ./build:/app/build    # сюда сохранятся обученные модели
    # Раскомментируйте для GPU (нужен nvidia-container-toolkit на хосте):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    command: ["python3", "training/finetune_ner.py", "--smoke-test", "--epochs", "30", "--batch-size", "16", "--lr", "3e-4"]
